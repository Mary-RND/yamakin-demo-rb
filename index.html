<!DOCTYPE html>
<html lang="ru">
<head>
<link rel="icon" href="data:,">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Демо-срез: конкурентное поле РБ — восстановление зубов</title>
<style>
  :root { --blue:#10365e; --blue2:#1b4d8f; --green:#2e7d32; --amber:#f9a825; --grey:#eceff3; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Segoe UI', Arial, sans-serif; background:#f4f6f9; color:#1a2733; }
  /* ---------- Пароль-экран ---------- */
  #gate { position:fixed; top:0; left:0; right:0; bottom:0; background:linear-gradient(150deg, var(--blue) 0%, var(--blue2) 100%);
          display:flex; align-items:center; justify-content:center; z-index:100; }
  #gate .box { background:#fff; padding:40px; border-radius:14px; max-width:420px; width:92%; text-align:center;
               box-shadow:0 18px 50px rgba(0,0,0,.35); }
  #gate h1 { font-size:20px; color:var(--blue); margin-bottom:6px; }
  #gate p { font-size:13px; color:#5b6b7b; margin-bottom:18px; }
  #gate input { width:100%; padding:12px 14px; border:1.5px solid #c4d0dd; border-radius:8px; font-size:15px;
                text-align:center; letter-spacing:2px; }
  #gate button { margin-top:14px; width:100%; padding:12px; background:var(--blue); color:#fff; border:none;
                 border-radius:8px; font-size:15px; cursor:pointer; }
  #gate button:hover { background:var(--blue2); }
  #gate .err { color:#c62828; font-size:13px; height:16px; margin-top:10px; }
  /* ---------- Контент ---------- */
  #app { display:none; }
  header { background:linear-gradient(150deg, var(--blue), var(--blue2)); color:#fff; padding:34px 6vw 28px; }
  header h1 { font-size:26px; font-weight:600; }
  header .sub { opacity:.85; font-size:14px; margin-top:8px; }
  .kpis { display:flex; flex-wrap:wrap; gap:18px; }
  .kpi { background:rgba(255,255,255,.12); border-radius:10px; padding:14px 22px; min-width:170px; }
  .kpi .n { font-size:30px; font-weight:700; }
  .kpi .l { font-size:12px; opacity:.85; max-width:230px; }
  main { padding:26px 6vw 60px; max-width:1400px; margin:0 auto; }
  h2 { font-size:19px; color:var(--blue); margin:30px 0 14px; border-bottom:2px solid #dbe2ea; padding-bottom:6px; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:16px; }
  .card { background:#fff; border-radius:12px; padding:18px; box-shadow:0 3px 12px rgba(16,54,94,.08); }
  .card h3 { font-size:16px; color:var(--blue); margin-bottom:4px; }
  .card .mfr { font-size:12px; color:#5b6b7b; margin-bottom:10px; }
  .card ul { list-style:none; font-size:13px; line-height:1.55; }
  .card li { padding:3px 0; border-bottom:1px dashed #e4e9ef; }
  .card li:last-child { border-bottom:none; }
  .tag { display:inline-block; font-size:11px; font-weight:700; padding:2px 9px; border-radius:20px; margin-right:6px; }
  .tag.ok { background:#e3f2e3; color:var(--green); }
  .tag.vol { background:#fff8e1; color:#b28600; }
  .tag.reg { background:#e8eef6; color:var(--blue); }
  .price { font-weight:700; color:var(--blue); }
  table { width:100%; border-collapse:collapse; background:#fff; font-size:13px; border-radius:10px; overflow:hidden;
          box-shadow:0 3px 12px rgba(16,54,94,.08); }
  th { background:var(--blue); color:#fff; text-align:left; padding:9px 10px; font-weight:600; font-size:12.5px; }
  td { padding:9px 10px; border-bottom:1px solid #e8edf2; vertical-align:top; }
  tr.ref td:nth-child(3) { background:#fffde7; }
  tr.br td:nth-child(3) { background:#eef7ee; }
  .src { font-size:11px; color:#6b7a89; word-break:break-all; }
  .bridge { background:#fff; border-left:5px solid var(--amber); border-radius:10px; padding:18px 22px;
            box-shadow:0 3px 12px rgba(16,54,94,.08); font-size:14px; line-height:1.6; }
  .bridge b { color:var(--blue); }
  footer { padding:24px 6vw; font-size:11.5px; color:#8494a4; line-height:1.5; }
  .print-only { display:none; }
  @media print {
    #gate { display:none !important; }
    #app { display:block !important; }
    header { -webkit-print-color-adjust:exact; }
    footer .pass-note { display:none; }
  }
</style>
</head>
<body>

<div id="gate">
  <div class="box">
    <h1>Демо-срез · Республика Беларусь</h1>
    <p>Конкурентное поле: восстановление зубов. Защищённый просмотр (AES-GCM, ключ = пароль).</p>
    <input id="pwd" type="password" placeholder="Пароль доступа" autocomplete="off">
    <button onclick="unlock()">Открыть дашборд</button>
    <div class="err" id="err"></div>
  </div>
</div>

<div id="app" style="display:none"></div>
<noscript><div style="padding:24px">Включите JavaScript — без него защищённый дашборд не откроется.</div></noscript>

const NONCE  = "4QRP0YFRnRp2om06";
const HINT   = "Пароль маленькими латинскими буквами, без пробелов";
function sanitize(s){ return s.replace(/[\u00A0\u2007\u202F\u200B-\u200D\uFEFF\s]+/g, ""); }
async function unlock(){
  const errEl = document.getElementById("err");
  if (!window.crypto || !crypto.subtle) { errEl.textContent = "Браузер не поддерживает WebCrypto — откройте страницу в свежем Chrome/Edge/Safari"; return; }
  const pw = sanitize(document.getElementById("pwd").value);
  if (!pw) { errEl.textContent = "Введите пароль"; return; }
  const raw = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(pw));
  const key = await crypto.subtle.importKey("raw", raw, "AES-GCM", true, ["decrypt"]);
  try {
    const plain = await crypto.subtle.decrypt(
      {name:"AES-GCM", iv:Uint8Array.from(atob(NONCE), c=>c.charCodeAt(0))},
      key, Uint8Array.from(atob(VAULT), c=>c.charCodeAt(0)));
    document.getElementById("app").innerHTML = new TextDecoder().decode(plain);
    document.getElementById("app").style.display = "block";
    document.getElementById("gate").style.display = "none";
  } catch(e) { errEl.textContent = "Неверный пароль. " + HINT; }
}
function bind() {
  var p = document.getElementById("pwd");
  if (p) { p.addEventListener("keydown", function(e){ if (e.key === "Enter") unlock(); }); }
}
function boot(){
  bind();
  try {
    const m = /(?:^|[&#])k=([^&]+)/.exec(location.hash || "");
    if (m) { document.getElementById("pwd").value = decodeURIComponent(m[1]); unlock(); return; }
  } catch(e) {}
  document.getElementById("err").textContent = "Страница загружена. Введите пароль и нажмите «Открыть дашборд».";
}
if (document.readyState === "complete" || document.readyState === "interactive") { boot(); }
else { window.addEventListener("DOMContentLoaded", boot); window.addEventListener("load", boot); }
